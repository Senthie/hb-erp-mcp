# erp-tools 网关：app（Python/MCP）+ PostgreSQL（api-key / 服务注册）+ nginx（TLS 终止）
#
# 启动（一条命令，.env 只有 3 个值，应用配置自动生成）：
#   cp docker/env.example .env      # 填 ERP_PUBLIC_HOST / POSTGRES_PASSWORD / ERP_HOST
#   bash scripts/up.sh              # 生成 config.yaml + 自签证书 + compose up
#
# 应用配置在 ./config.yaml（mode: mcp，由 scripts/up.sh 按 .env 生成；也可用
#   `erp init --mode mcp` 手工生成后自己改）。
#
# 取 api-key（每个使用者用自己的工号密码，密码不进容器、不落盘）：
#   erp key --server https://<域名或IP>:8443 --write-mcp-json ./mcp.json
#
# 访问：
#   https://<域名或IP>:8443/ui                # 可视化登录 / 服务注册
#   https://<域名或IP>:8443/mcp               # MCP 端点（需 Bearer api-key）
#   https://<域名或IP>:8443/healthz           # 健康检查（无需 key）
#
# 想让 nginx 用纯 HTTP 内网配置：在 .env 里加 NGINX_CONF=docker/nginx-http.conf
# 定时拉取 GitHub 并重建：bash scripts/deploy.sh（见 docs/mcp.md「6.2 定时拉取 + 自动重建」）

name: erp-tools

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD（URL 安全字符）}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    volumes:
      # api-key（sha256）与 MCP 服务注册信息；**down -v 会清空**
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  app:
    build: .
    image: erp-tools:0.3.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # 应用配置全部在这份 config.yaml 里（mode: mcp）；容器里只保留路径与时钟，
    # 账号密码一律不进容器 —— 每个使用者自己 POST /v1/auth/login 换 api-key。
    volumes:
      - ./config.yaml:/app/api/config.yaml:ro
      # 运行时文件（cookie / qxid 缓存 / proxy.secret / register.secret）：命名卷，**重建堆栈不丢**
      - erpdata:/data
    environment:
      ERP_DATA_DIR: /data
      COOKIE_DIR: /data/cookies
      TZ: Asia/Shanghai
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${ERP_HTTP_PORT:-8080}:80"
      - "${ERP_HTTPS_PORT:-8443}:443"
    volumes:
      - ./${NGINX_CONF:-docker/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      # 证书目录默认在仓库里的 ./certs（已 gitignore）。
      # 若服务器是「每次重新 clone → 重建」，把证书放到仓库外并设 ERP_CERT_DIR=/etc/erp-tools/certs
      - ${ERP_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # 显式固定卷名：即使换目录 clone、或用 -p 指定别的项目名，数据卷还是同一个
  erpdata:
    name: ${ERP_DATA_VOLUME:-erp-tools-erpdata}
  # PostgreSQL 数据（api-key 的 sha256 + MCP 服务注册信息）
  pgdata:
    name: ${ERP_PG_VOLUME:-erp-tools-pgdata}
