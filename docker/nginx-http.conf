# erp-tools MCP 网关 —— 纯 HTTP 内网版（**没有 TLS**）
#
# ⚠️ 用它就意味着 api-key 在内网里是明文传输的。
#    只有在「可信内网 + 临时验证」时才用，正式环境请换 docker/nginx.conf。
#    启用方式：
#      在 .env 里写  NGINX_CONF=docker/nginx-http.conf
#      并给 app 服务保留 ERPSRV_ALLOW_PLAINTEXT=1
#
# Host 同样必须原样透传（含端口），否则应用侧会返回 421。

upstream erp_tools {
    server app:8765;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    location = /healthz {
        access_log off;
        proxy_pass http://erp_tools;
    }

    location / {
        proxy_pass http://erp_tools;
    }
}
