# erp-tools MCP 网关 —— TLS 终止 + 反向代理
#
# 挂载点：
#   /etc/nginx/conf.d/default.conf  ← 本文件
#   /etc/nginx/certs/erp-tools.crt  ← 证书（公钥）
#   /etc/nginx/certs/erp-tools.key  ← 私钥
#
# 证书生成（SAN 必须写全客户端实际使用的地址）：
#   python scripts\make-cert.py --host erp-tools.lan --host 192.168.1.226 --out-dir certs
#
# 关键点：Host 头必须**原样透传（含端口）**。应用侧用 ERPSRV_ALLOW_HOST 逐字比对 Host
# 做 DNS-rebinding 防护，写成 $host 会丢掉端口 → 客户端收到 421。

upstream erp_tools {
    server app:8765;
    keepalive 16;
}

# ── HTTP：只做跳转（顺便留给 ACME http-01 校验）────────────
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 容器内健康检查走这里（避免 301 → https 自签证书导致的探针失败）
    location = /healthz {
        access_log off;
        proxy_set_header Host $http_host;
        proxy_pass http://erp_tools;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：真正的入口 ──────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;                      # nginx >= 1.25.1；更老的版本改成 listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/erp-tools.crt;
    ssl_certificate_key /etc/nginx/certs/erp-tools.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # MCP 的 JSON-RPC 报文很小，8m 足够；别开太大
    client_max_body_size 8m;

    # ── 反向代理公共设置 ──
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    # 关缓冲：MCP 的 Streamable HTTP 可能返回 text/event-stream，
    # 一旦被 nginx 攒起来，客户端会一直等不到首字节
    proxy_buffering         off;
    proxy_request_buffering off;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    # ★ 必须用 $http_host（带端口），不能用 $host
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    location = /healthz {
        access_log off;
        proxy_pass http://erp_tools;
    }

    location / {
        proxy_pass http://erp_tools;
    }
}
